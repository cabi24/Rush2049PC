# TEMPORARY diagnostic workflow for the Windows runtime work (to be removed before merging).
name: Windows diag

on:
  push:
    branches: [port-windows-runtime]
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-24.04
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build python3 \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev \
            libz-mingw-w64-dev
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake > /dev/null
          cmake --build build/win -j4 --target rush2049pc 2>&1 | cut -c1-2000 | grep -E "error|warning: .*(refptr|truncat)" || true
          ls -la build/win/rush2049pc.exe
          x86_64-w64-mingw32-gcc-posix -O2 -Wall -o build/win/win_timing.exe tools/port/diag/win_timing.c -static -lwinmm
      - uses: actions/upload-artifact@v4
        with:
          name: diag-cross
          path: |
            build/win/rush2049pc.exe
            build/win/win_timing.exe
            build/win/pc-data/data_symbols.txt
          if-no-files-found: error

  run:
    needs: cross
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diag-cross
          path: bin
      - name: Timing primitives
        run: bin/win_timing.exe
      - name: Self-test, real time
        run: bin/rush2049pc.exe --selftest 2>&1 || true
      - name: Self-test, virtual clock
        run: bin/rush2049pc.exe --selftest --fast 2>&1 || true
      - name: Self-test, virtual clock, traced
        run: |
          RUSH_DIAG_TIME=1 bin/rush2049pc.exe --selftest --fast --trace-os > trace.log 2>&1 || true
          wc -l trace.log
          grep -c "main wait: timeout" trace.log || true
          grep -c "main wait: event" trace.log || true
          head -400 trace.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-logs
          path: |
            trace.log
          if-no-files-found: ignore
