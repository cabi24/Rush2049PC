# TEMPORARY diagnostic workflow for the Windows runtime work (to be removed before merging).
name: Windows diag

on:
  push:
    branches: [port-windows-runtime]
  workflow_dispatch:

jobs:
  cross:
    runs-on: ubuntu-24.04
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build python3 \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev \
            libz-mingw-w64-dev
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DRUSH_FETCH_SDL2=ON > /dev/null
          cmake --build build/win -j4 --target rush2049pc 2>&1 | cut -c1-2000 | grep -E "error|warning: .*(refptr|truncat)" || true
          ls -la build/win/rush2049pc.exe
          x86_64-w64-mingw32-gcc-posix -O2 -Wall -o build/win/win_timing.exe tools/port/diag/win_timing.c -static -lwinmm
      - uses: actions/upload-artifact@v4
        with:
          name: diag-cross
          path: |
            build/win/rush2049pc.exe
            build/win/win_timing.exe
            build/win/pc-data/data_symbols.txt
          if-no-files-found: error

  run:
    needs: cross
    runs-on: windows-latest
    env:
      MESA_7Z: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diag-cross
          path: bin
      - name: Without Mesa
        run: |
          bin/win_timing.exe
          time (bin/rush2049pc.exe --selftest > st.log 2>&1); tail -3 st.log
          time (bin/rush2049pc.exe --selftest --fast > st.log 2>&1); tail -3 st.log
      - name: Software OpenGL
        run: |
          curl -sSL -o mesa.7z "$MESA_7Z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          cp mesa/x64/*.dll bin/
          ls -la bin/
      - name: With Mesa
        run: |
          bin/win_timing.exe gl
          time (bin/rush2049pc.exe --selftest > st.log 2>&1); cat st.log
          time (bin/rush2049pc.exe --selftest --fast > st.log 2>&1); cat st.log
          RUSH_DIAG_TIME=1 bin/rush2049pc.exe --selftest --fast --trace-os > trace.log 2>&1 || true
          wc -l trace.log
          grep -c "main wait: timeout" trace.log || true
          grep -c "main wait: event" trace.log || true
          head -300 trace.log
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Synthetic paths
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -X utf8 src/tools/port/synth_rom.py --data-symbols bin/pc-data/data_symbols.txt \
            --out synth/rush2049_synth.z64
          python -X utf8 src/tools/port/synth_paths.py --exe bin/rush2049pc.exe --rom synth/rush2049_synth.z64 \
            --logs synth/paths || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-logs
          path: |
            trace.log
            synth/paths/
          if-no-files-found: ignore
