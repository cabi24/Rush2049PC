# The PC port (docs/PORT_PLAN.md): build, unit tests, and a boot without a ROM, on x86-64 and aarch64 Linux.
# No ROM is involved: the tests use synthetic data, --no-rom boots the game on a blank cartridge, and a synthetic
# cartridge of original data (tools/port/synth_rom.py, docs/port/SYNTH.md) boots it into a race. Linux and the
# Windows cross build run as Debug (-O0) and RelWithDebInfo (-O2 -g), and the optimized job checks that the two give
# the same data tables and the same game (docs/port/OPTIMIZED.md).
name: PC port

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        build: [Debug, RelWithDebInfo]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 \
            zlib1g-dev libegl-dev libgles-dev libsdl2-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build/pc -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }}
      - name: Build
        # Lines cut short: a failed link's command line lists every object and hides the error after it.
        run: |
          set -o pipefail
          cmake --build build/pc -j4 2>&1 | cut -c1-2000
      - name: Tests
        # A failing test is run again under gdb for a backtrace.
        run: |
          ctest --test-dir build/pc --output-on-failure && exit 0
          sudo apt-get install -y --no-install-recommends gdb > /dev/null
          ctest --test-dir build/pc --show-only=json-v1 > tests.json
          python3 - <<'PY'
          import json, subprocess
          failed = {l.split(":", 1)[1].strip() for l in open("build/pc/Testing/Temporary/LastTestsFailed.log")}
          for t in json.load(open("tests.json"))["tests"]:
              if t["name"] in failed:
                  wd = next((p["value"] for p in t.get("properties", []) if p["name"] == "WORKING_DIRECTORY"), None)
                  print("::group::gdb " + t["name"], flush=True)
                  subprocess.run(["gdb", "-batch", "-ex", "run", "-ex", "bt", "-ex", "info registers", "--args"]
                                 + t["command"], cwd=wd)
                  print("::endgroup::", flush=True)
          PY
          exit 1
      - name: Boot without a ROM
        # On a blank cartridge the game boots through its init into the first file loads and then stops (the
        # files are zero-size): the check is that it gets that far.
        run: |
          RUSH_TRACE_WAVES=1 build/pc/rush2049pc --no-rom --headless --no-config --audio null --seconds 10 \
            > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - name: Boot the synthetic cartridge
        # tools/port/synth_rom.py writes a cartridge of original, minimal data (docs/port/SYNTH.md). The game boots
        # on it through the front end's screens into each of the paths the press scripts in tools/port/synth take
        # (races for 1-4 players, circuit, stunt, battle, the attract demo...) and runs each for a while, on the
        # virtual clock (--fast); the step fails if one faults or doesn't get there. The one-player race also runs
        # in real time. (ctest's synth_boot_* do the same; this keeps the logs.)
        run: |
          python3 tools/port/synth_rom.py
          python3 tools/port/synth_paths.py --exe build/pc/rush2049pc --rom build/synth/rush2049_synth.z64 \
            --logs build/synth/paths
      - name: Raw N64 offsets into moved records
        # m2c code that reaches a blit's, a car's or another pointer-holding record's field at its N64 offset,
        # through a pointer typed void * or s32 (tools/port/offset_check.py, docs/port/LAYOUT.md 9). Fails on an
        # open finding.
        if: matrix.build == 'Debug'
        run: python3 tools/port/offset_check.py --build build/pc -j 4 --strict
      - name: One storage under two names
        # What an optimizing compiler takes for two objects (tools/port/alias_check.py, docs/port/OPTIMIZED.md).
        if: matrix.build == 'RelWithDebInfo'
        run: python3 tools/port/alias_check.py --build build/pc -j 4
      - name: Census
        if: matrix.build == 'Debug'
        run: python3 tools/port/census.py --build build/pc --jobs 4 | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}-${{ matrix.build }}
          path: |
            boot.log
            build/synth/paths/
            build/synth/rush2049_synth.txt
            build/pc/pc-data/data_layout.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          # For the optimized job: the program and its generated tables.
          name: build-${{ matrix.os }}-${{ matrix.build }}
          path: |
            build/pc/rush2049pc
            build/pc/pc-data/data.c
            build/pc/pc-data/data_symbols.txt
          if-no-files-found: error

  optimized:
    # RelWithDebInfo against Debug on each Linux architecture (docs/port/OPTIMIZED.md). The data tables gen_data
    # generates must be the same files (it reads the types of -O0 objects in every build type), and the game must be
    # the same along every synthetic path: the same states at the same retraces and the first car at the same place
    # to the bit, every second (tools/port/synth_compare.py, on the virtual clock).
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 zlib1g-dev libegl-dev libgles-dev libsdl2-dev \
            libasound2-dev
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-Debug
          path: debug
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-RelWithDebInfo
          path: rel
      - name: The generated tables
        run: |
          for f in data.c data_symbols.txt; do
            cmp debug/pc-data/$f rel/pc-data/$f && echo "$f: the same in both builds"
          done
      - name: Debug against RelWithDebInfo along the synthetic paths
        env:
          PC_DATA_REPORT: ""
        run: |
          chmod +x debug/rush2049pc rel/rush2049pc
          python3 tools/port/synth_rom.py --data-symbols debug/pc-data/data_symbols.txt --out synth/rush2049_synth.z64
          python3 tools/port/synth_compare.py --exe debug/rush2049pc --exe rel/rush2049pc \
            --rom synth/rush2049_synth.z64 --runs 2 --same --logs synth/compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-optimized-${{ matrix.os }}
          path: synth/compare/*.log
          if-no-files-found: ignore

  windows-cross:
    # Windows x86-64 cross-compiled with mingw-w64 (cmake/mingw-w64.cmake, docs/port/WINDOWS.md), with SDL2 built
    # from source: the window, controllers and SDL audio compile and link. The windows-run job runs the program.
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, RelWithDebInfo]
    runs-on: ubuntu-24.04
    # Debian 12's mingw-w64 (GCC 12.2, binutils 2.40), the toolchain the port was first cross-built with; and
    # deb.debian.org is quicker than the runners' Ubuntu mirror, which took minutes a package on some runs.
    container: debian:12
    defaults:
      run:
        shell: bash   # a container's default is sh
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build python3 \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev \
            libz-mingw-w64-dev
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DRUSH_FETCH_SDL2=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build/win -j4 2>&1 | cut -c1-2000
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cross-${{ matrix.build }}
          # The executable, and its data report, from which windows-run generates the synthetic cartridge; data.c
          # for the optimized-windows job.
          path: |
            build/win/rush2049pc.exe
            build/win/pc-data/data_symbols.txt
            build/win/pc-data/data.c
          if-no-files-found: error

  optimized-windows:
    # The Windows cross build's generated tables: the same files in Debug and RelWithDebInfo (docs/port/OPTIMIZED.md).
    needs: windows-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-Debug
          path: debug
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-RelWithDebInfo
          path: rel
      - name: The generated tables
        run: |
          for f in data.c data_symbols.txt; do
            cmp debug/pc-data/$f rel/pc-data/$f && echo "$f: the same in both builds"
          done

  windows-run:
    # The cross-compiled program on Windows: the self-test, the boot without a ROM and the synthetic cartridge's
    # paths (generated here from the cross build's data report). Mesa's opengl32.dll (llvmpipe, from
    # mesa-dist-win) next to it gives the headless WGL context a GL 3 driver on a runner without a GPU.
    needs: windows-cross
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, RelWithDebInfo]
    runs-on: windows-latest
    env:
      MESA_7Z: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-${{ matrix.build }}
          path: bin
      - name: Software OpenGL
        run: |
          curl -sSL -o mesa.7z "$MESA_7Z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          cp mesa/x64/*.dll bin/
      - name: Self-test
        run: bin/rush2049pc.exe --selftest
      - name: Boot without a ROM
        run: |
          RUSH_TRACE_WAVES=1 GALLIUM_DRIVER=llvmpipe bin/rush2049pc.exe --no-rom --headless --no-config \
            --audio null --seconds 10 > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Boot the synthetic cartridge
        # As on Linux (docs/port/SYNTH.md): the generator reads the build's data report, then each press script's
        # path runs.
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -X utf8 src/tools/port/synth_rom.py --data-symbols bin/pc-data/data_symbols.txt \
            --out synth/rush2049_synth.z64
          python -X utf8 src/tools/port/synth_paths.py --exe bin/rush2049pc.exe --rom synth/rush2049_synth.z64 \
            --logs synth/paths
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows-run-${{ matrix.build }}
          path: |
            boot.log
            synth/paths/
            synth/rush2049_synth.txt
          if-no-files-found: ignore

  windows:
    # Windows x86-64 built natively with MSYS2's mingw-w64 (UCRT64), with its SDL2: the build, all tests, the
    # self-test and the boot without a ROM. Mesa's llvmpipe for the GL tests, as in windows-run. A failing test is
    # run again under gdb for a backtrace.
    runs-on: windows-latest
    env:
      MESA_7Z: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-gdb p7zip curl
      - name: Configure
        run: cmake -S . -B build/pc -G Ninja
      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build build/pc -j4 2>&1 | cut -c1-2000
      - name: Software OpenGL
        run: |
          curl -sSL -o mesa.7z "$MESA_7Z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          for d in build/pc build/pc/port/gfx build/pc/port/input; do cp mesa/x64/*.dll $d/; done
      - name: Tests
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          ctest --test-dir build/pc --output-on-failure && exit 0
          ctest --test-dir build/pc --show-only=json-v1 > tests.json
          python3 - <<'PY'
          import json, subprocess
          failed = {l.split(":", 1)[1].strip() for l in open("build/pc/Testing/Temporary/LastTestsFailed.log")}
          for t in json.load(open("tests.json"))["tests"]:
              if t["name"] in failed:
                  wd = next((p["value"] for p in t.get("properties", []) if p["name"] == "WORKING_DIRECTORY"), None)
                  print("::group::gdb " + t["name"], flush=True)
                  subprocess.run(["gdb", "-batch", "-ex", "run", "-ex", "bt", "-ex", "info registers", "--args"]
                                 + t["command"], cwd=wd)
                  print("::endgroup::", flush=True)
          PY
          exit 1
      - name: Self-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: build/pc/rush2049pc.exe --selftest
      - name: Boot without a ROM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          RUSH_TRACE_WAVES=1 GALLIUM_DRIVER=llvmpipe build/pc/rush2049pc.exe --no-rom --headless --no-config \
            --audio null --seconds 10 > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: |
            boot.log
            build/pc/pc-data/data_layout.txt
          if-no-files-found: ignore

  n64-neutral:
    # PC edits to shared game C must leave what IDO compiles unchanged (tools/port/n64_neutral.py). The real
    # proof is the matching N64 build, which needs IDO; this compares preprocessed tokens and lines.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base revision 09da2f0
      - name: Shared game C against the decompilation it started from
        run: python3 tools/port/n64_neutral.py --base 09da2f0 -q $(git diff --name-only 09da2f0 -- src include)
