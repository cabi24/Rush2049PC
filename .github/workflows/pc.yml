# The PC port (docs/PORT_PLAN.md): build, unit tests, and a boot without a ROM, on x86-64 and aarch64 Linux.
# No ROM is involved: the tests use synthetic data, and --no-rom boots the game on a blank cartridge.
name: PC port

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 \
            zlib1g-dev libegl-dev libgles-dev libsdl2-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build/pc -G Ninja
      - name: Build
        # Lines cut short: a failed link's command line lists every object and hides the error after it.
        run: |
          set -o pipefail
          cmake --build build/pc -j4 2>&1 | cut -c1-2000
      - name: Tests
        run: ctest --test-dir build/pc --output-on-failure
      - name: Boot without a ROM
        # On a blank cartridge the game boots through its init into the first file loads and then stops (the
        # files are zero-size): the check is that it gets that far.
        run: |
          RUSH_TRACE_WAVES=1 build/pc/rush2049pc --no-rom --headless --no-config --audio null --seconds 10 \
            > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - name: Census
        run: python3 tools/port/census.py --build build/pc --jobs 4 | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: |
            boot.log
            build/pc/pc-data/data_layout.txt
          if-no-files-found: ignore
