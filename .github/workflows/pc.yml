# The PC port (docs/PORT_PLAN.md): build, unit tests, and a boot without a ROM, on x86-64 and aarch64 Linux.
# No ROM is involved: the tests use synthetic data, --no-rom boots the game on a blank cartridge, and a synthetic
# cartridge of original data (tools/port/synth_rom.py, docs/port/SYNTH.md) boots it into a race. Linux and the
# Windows cross build run as Debug (-O0) and RelWithDebInfo (-O2 -g), and the optimized job checks that the two give
# the same data tables and the same game (docs/port/OPTIMIZED.md).
name: PC port

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        build: [Debug, RelWithDebInfo]
        include:
          # The high frame rate's pacing checks, whose bounds are the host's own (at most 10% of the vblanks lost to
          # skipped ticks, frames between at least half of vsync off's): llvmpipe on the 4-core arm runner draws
          # about 150 of a race's 900 frames between, and lands on the bounds' edges run after run (10-13% lost, 70
          # of 75), three tries alike. They run on the x86-64 runners, whose pacing is the same C.
          - os: ubuntu-24.04-arm
            # paced_vsync, the same check in paced mode, lands there too (13-15% of the vblanks lost, three tries
            # alike).
            skip_tests: '^(hfr_paced|hfr_paced_queue|hfr_paced_60|hfr_paced_game60|paced_vsync|realtime_game60_v60|realtime_auto_even)$'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 ccache \
            zlib1g-dev libegl-dev libgles-dev libsdl2-dev libasound2-dev
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Compiler cache
        # ccache's objects from the last run of this configuration: a merge that changes a few files compiles those
        # (the checks compile from compile_commands.json, which has no launcher in it)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.build }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.build }}-
      - name: Configure
        run: |
          cmake -S . -B build/pc -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        # Lines cut short: a failed link's command line lists every object and hides the error after it.
        run: |
          set -o pipefail
          ccache -z -M 1G > /dev/null
          cmake --build build/pc -j4 2>&1 | cut -c1-2000
          ccache -s | grep -iE "hits|misses|cache size" || true
      - name: Tests
        # Four at once; the ultra self-test, the audio output's drains and the long hfr_timing are RUN_SERIAL and run
        # alone. Then the tests that measure the host's clock (label realtime: the real-time race, audio_realtime, the
        # high frame rate's, live input, the pak writer's), one at a time and up to three tries each: a shared
        # runner's stall fails one now and then, a regression every try. A failing test is run again under gdb for a
        # backtrace.
        run: |
          ex=(); [ -n "${{ matrix.skip_tests }}" ] && ex=(-E '${{ matrix.skip_tests }}')
          t=build/pc/Testing/Temporary/LastTestsFailed.log
          s=0; : > failed.log
          ctest --test-dir build/pc -j4 --output-on-failure -LE realtime "${ex[@]}" ||
            { s=1; cat $t >> failed.log || :; }
          rm -f $t
          ctest --test-dir build/pc --output-on-failure -L realtime --repeat until-pass:3 "${ex[@]}" ||
            { s=1; cat $t >> failed.log || :; }
          [ $s = 0 ] && exit 0
          sudo apt-get install -y --no-install-recommends gdb > /dev/null
          ctest --test-dir build/pc --show-only=json-v1 > tests.json
          python3 - <<'PY'
          import json, subprocess
          failed = {l.split(":", 1)[1].strip() for l in open("failed.log") if ":" in l}
          for t in json.load(open("tests.json"))["tests"]:
              if t["name"] in failed:
                  wd = next((p["value"] for p in t.get("properties", []) if p["name"] == "WORKING_DIRECTORY"), None)
                  print("::group::gdb " + t["name"], flush=True)
                  subprocess.run(["gdb", "-batch", "-ex", "run", "-ex", "bt", "-ex", "info registers", "--args"]
                                 + t["command"], cwd=wd)
                  print("::endgroup::", flush=True)
          PY
          exit 1
      - name: Boot without a ROM
        # On a blank cartridge the game boots through its init into the first file loads and then stops (the
        # files are zero-size): the check is that it gets that far.
        run: |
          RUSH_TRACE_WAVES=1 build/pc/rush2049pc --no-rom --headless --no-config --audio null --seconds 10 \
            > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - name: Raw N64 offsets into moved records
        # m2c code that reaches a blit's, a car's or another pointer-holding record's field at its N64 offset,
        # through a pointer typed void * or s32 (tools/port/offset_check.py, docs/port/LAYOUT.md 9). Fails on an
        # open finding.
        if: matrix.build == 'Debug'
        run: python3 tools/port/offset_check.py --build build/pc -j 4 --strict
      - name: One storage under two names
        # What an optimizing compiler takes for two objects (tools/port/alias_check.py, docs/port/OPTIMIZED.md).
        if: matrix.build == 'RelWithDebInfo'
        run: python3 tools/port/alias_check.py --build build/pc -j 4
      - name: Data reached past its declaration
        # Game C that reaches outside the extent its own file declares for a data symbol, which an optimizing GCC
        # takes for the object's size (tools/port/bounds_check.py, docs/port/OPTIMIZED.md 2.7). It compiles the game
        # at -O2 with the array-bounds warnings and fails on a finding not in tools/port/bounds_reviewed.txt, made
        # with this runner's GCC 13 on x86-64 (and GCC 14, mingw-w64 12): aarch64's warns and inlines otherwise.
        if: matrix.build == 'RelWithDebInfo' && matrix.os == 'ubuntu-24.04'
        run: python3 tools/port/bounds_check.py --build build/pc -j 4
      - name: Census
        if: matrix.build == 'Debug'
        run: python3 tools/port/census.py --build build/pc --jobs 4 | tail -20
      - name: No new fixed-address site
        # Every place that relies on the RDRAM window at host 0x80000000, by class (tools/port/nofixed_audit.py,
        # docs/port/NOFIXED.md 3): fails when a class's count grows past tools/port/nofixed_baseline.json, so no new
        # site comes in unnoticed while phase C shrinks them (lower the file's counts as they fall). The compiler
        # classes are GCC's warnings: the baseline was made with GCC 14 on x86-64, which warns as this runner's 13.
        if: matrix.build == 'Debug' && matrix.os == 'ubuntu-24.04'
        run: |
          python3 tools/port/nofixed_audit.py --build build/pc --jobs 4 --out nofixed_audit.txt \
            --baseline tools/port/nofixed_baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # The synthetic cartridge's paths run in ctest (synth_boot_*: tools/port/synth_rom.py's cartridge of
          # original data, docs/port/SYNTH.md, booted through the front end into each press script's path, the race
          # in real time too), with the high frame rate, live input and real-time checks: their logs and the
          # cartridge's report.
          name: logs-${{ matrix.os }}-${{ matrix.build }}
          path: |
            boot.log
            nofixed_audit.txt
            build/pc/synth/paths/
            build/pc/synth/hfr/
            build/pc/synth/input/
            build/pc/synth/realtime/*.log
            build/pc/synth/rush2049_synth.txt
            build/pc/pc-data/data_layout.txt
            build/pc/synth/replay/*.pads
            build/pc/synth/replay/*.replay.log
            build/pc/synth/rush2049_synth.z64
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          # For the optimized job: the program and its generated tables.
          name: build-${{ matrix.os }}-${{ matrix.build }}
          path: |
            build/pc/rush2049pc
            build/pc/pc-data/data.c
            build/pc/pc-data/data_symbols.txt
          if-no-files-found: error

  optimized:
    # RelWithDebInfo against Debug on each Linux architecture (docs/port/OPTIMIZED.md). The data tables gen_data
    # generates must be the same files (it reads the types of -O0 objects in every build type), and the game must be
    # the same along every synthetic path: the same states at the same retraces and the first car at the same place
    # to the bit, every second (tools/port/synth_compare.py, on the virtual clock).
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 zlib1g-dev libegl-dev libgles-dev libsdl2-dev \
            libasound2-dev
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-Debug
          path: debug
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.os }}-RelWithDebInfo
          path: rel
      - name: The generated tables
        run: |
          for f in data.c data_symbols.txt; do
            cmp debug/pc-data/$f rel/pc-data/$f && echo "$f: the same in both builds"
          done
      - name: Debug against RelWithDebInfo along the synthetic paths
        env:
          PC_DATA_REPORT: ""
        run: |
          chmod +x debug/rush2049pc rel/rush2049pc
          python3 tools/port/synth_rom.py --data-symbols debug/pc-data/data_symbols.txt --out synth/rush2049_synth.z64
          python3 tools/port/synth_compare.py --exe debug/rush2049pc --exe rel/rush2049pc \
            --rom synth/rush2049_synth.z64 --runs 2 --same --logs synth/compare -j 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-optimized-${{ matrix.os }}
          path: synth/compare/*.log
          if-no-files-found: ignore

  nofixed:
    # The moved build (cmake -DRUSH_NOFIXED=ON, docs/port/NOFIXED.md): the RDRAM window a section of the executable,
    # the names relative to it, no fixed mapping and no GOT fix-up; not the default until phase D, so it must not rot
    # meanwhile. Its self-test and synthetic paths, the loader's check of the moved tables, and the moved program
    # against the fixed Debug one along every synthetic path: the same states at the same retraces and the first car
    # at the same place to the bit (tools/port/synth_compare.py --same).
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 ccache \
            zlib1g-dev libegl-dev libgles-dev libsdl2-dev libasound2-dev
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-nofixed-${{ github.sha }}
          restore-keys: ccache-nofixed-
      - name: Configure
        run: |
          cmake -S . -B build/moved -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRUSH_NOFIXED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          ccache -z -M 1G > /dev/null
          cmake --build build/moved -j4 2>&1 | cut -c1-2000
          ccache -s | grep -iE "hits|misses|cache size" || true
      - name: Tests
        # The self-test (its window and names checks, the controller and pak ones too), the loader's checks of the
        # moved tables, and every synthetic path but the one on the host's clock (synth_boot_race, which the fixed
        # jobs run): the test programs that map their own window at 0x80000000 are phase C's.
        run: |
          ctest --test-dir build/moved -j4 --output-on-failure -LE realtime \
            -R '^(ultra_selftest.*|pc_data_rom|pc_data_synthetic|synth_.*)$'
      - uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-24.04-Debug
          path: fixed
      - name: Fixed against moved along the synthetic paths
        env:
          PC_DATA_REPORT: ""
        run: |
          chmod +x fixed/rush2049pc
          python3 tools/port/synth_compare.py --exe fixed/rush2049pc --exe build/moved/rush2049pc \
            --rom build/moved/synth/rush2049_synth.z64 --runs 1 --same --logs synth/compare -j 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-nofixed
          path: |
            build/moved/synth/paths/
            synth/compare/*.log
            build/moved/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitize:
    # The sanitizer builds (docs/port/SANITIZE.md): UndefinedBehaviorSanitizer on x86-64, every check on port/ code and a
    # curated set on the game C; AddressSanitizer with it on aarch64 (its x86-64 shadow memory covers the RDRAM window
    # at 0x80000000). Every test but the two that measure real time, the synthetic paths among them; a finding not in
    # tools/port/sanitize/*.supp fails its test (halt_on_error, set by the build's ctest environment).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sanitize: undefined
            skip_tests: '^(audio_realtime|input_live_drive|hfr_paced|hfr_paced_queue|hfr_paced_60|hfr_paced_game60|paced_vsync|audio_realtime_game60|realtime_game60_v60|realtime_auto_even)$'
          - os: ubuntu-24.04-arm
            sanitize: address,undefined
            # and the race and PC SETUP's path on the host's clock, which under ASan on 4 cores don't reach their
            # states in time, the pak writer's check, whose control and run both drop thousands of retraces there,
            # and the saves' hot swap, whose F1 presses are on the host's clock too (tools/port/saves/swap.press).
            # Online play's (docs/port/NETPLAY.md): its many runs of the same C took the job past its limit (106 of
            # 402 tests in 150 minutes on 7a3cf83: a two-process session 15-20 minutes under ASan here). Each kind runs
            # once: replay_file, gate_same, hash_aslr, and the sessions' race, ends, desync, adopt, wait and mismatch
            # (the paths before the game, the window open); not every synthetic path again on the replayed and paced
            # clocks (replay_same_*, paced_same_*, paced_model_*: the x86-64 jobs' and windows-replay's), nor the
            # network models and the other sessions (the library's own net_ tests run them under ASan in seconds), nor
            # the paced checks that measure the host's clock (paced_load beside four busy processes: its reference run
            # alone took 298 s on ba3a8c0, and the test its 600 s).
            skip_tests: >-
              ^(audio_realtime|input_live_drive|hfr_paced|hfr_paced_queue|hfr_paced_60|hfr_paced_game60|paced_vsync|audio_realtime_game60|realtime_game60_v60|realtime_auto_even|synth_boot_race|synth_boot_pcsetup|pak_realtime|saves_files_swap|replay_same_.*|paced_same_.*|paced_model_.*|net_session_(sim_.*|battle2p|battlequit|memhigh2p|race2p12|pause|raceend|menu|auto|paced|fuzz)|paced_(realtime|audio|hold|coarse|desktop|gate|latency|stop|load))$
    runs-on: ${{ matrix.os }}
    # the arm ASan job's tests alone took 88 minutes on 1ec5f69 (run 41821298325: fps_physics 25, saves_files 17,
    # synth_memory_same's three 11-16 each), and the job stopped at 90 in hfr_timing, its last; online play's kept
    # tests add about half an hour there (skip_tests)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 ccache \
            zlib1g-dev libegl-dev libgles-dev libsdl2-dev libasound2-dev
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          # GCC 13's sanitizer runtimes predate 32 bits of mmap randomization, which can place a mapping inside
          # their shadow memory
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sanitize-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-sanitize-${{ matrix.os }}-
      - name: Configure
        run: |
          cmake -S . -B build/san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRUSH_SANITIZE=${{ matrix.sanitize }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          ccache -z -M 1G > /dev/null
          cmake --build build/san -j4 2>&1 | cut -c1-2000
          ccache -s | grep -iE "hits|misses|cache size" || true
      - name: Tests
        # The tests that run on the host's clock and measure it (matrix.skip_tests: audio_realtime, input_live_drive,
        # the hfr_paced ones, and on the arm runner the real-time race): the sanitizers slow the program down several
        # times (docs/port/SANITIZE.md 5). The rest labelled realtime (the loopback sessions' 59.9 ticks a second) run
        # after the others, alone, up to three tries each, as the linux job's do: the arm runner under ASan fell short
        # once (59.84 on 32cb147, the hashes the same throughout).
        run: |
          s=0
          ctest --test-dir build/san --output-on-failure -j4 -LE realtime -E '${{ matrix.skip_tests }}' || s=1
          ctest --test-dir build/san --output-on-failure -L realtime --repeat until-pass:3 \
            -E '${{ matrix.skip_tests }}' || s=1
          exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-sanitize-${{ matrix.os }}
          path: |
            build/san/synth/paths/
            build/san/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  windows-cross:
    # Windows x86-64 cross-compiled with mingw-w64 (cmake/mingw-w64.cmake, docs/port/WINDOWS.md), with SDL2 built
    # from source: the window, controllers and SDL audio compile and link. The windows-run job runs the program.
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, RelWithDebInfo]
    runs-on: ubuntu-24.04
    # Debian 12's mingw-w64 (GCC 12.2, binutils 2.40), the toolchain the port was first cross-built with; and
    # deb.debian.org is quicker than the runners' Ubuntu mirror, which took minutes a package on some runs.
    container: debian:12
    defaults:
      run:
        shell: bash   # a container's default is sh
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build python3 ccache \
            binutils-mingw-w64-x86-64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev \
            libz-mingw-w64-dev
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Git in the container
        # The checkout belongs to another user than the container's root, and git refuses it ("dubious ownership"):
        # cmake/version.cmake then gets no commit, and the program says "unknown", which windows-replay's recordings
        # (made by the Linux jobs, which know theirs) must match. As release.yml does.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compiler cache
        # the game, the port and SDL2's own sources (fetched by RUSH_FETCH_SDL2), as on Linux
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-windows-cross-${{ matrix.build }}-${{ github.sha }}
          restore-keys: ccache-windows-cross-${{ matrix.build }}-
      - name: Configure
        run: |
          cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DRUSH_FETCH_SDL2=ON \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          set -o pipefail
          ccache -z -M 1G > /dev/null
          cmake --build build/win -j4 2>&1 | cut -c1-2000
          ccache -s | grep -iE "hits|misses|cache size" || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cross-${{ matrix.build }}
          # The executable, and its data report, from which windows-run generates the synthetic cartridge; data.c
          # for the optimized-windows job.
          path: |
            build/win/rush2049pc.exe
            build/win/pc-data/data_symbols.txt
            build/win/pc-data/data.c
          if-no-files-found: error

  optimized-windows:
    # The Windows cross build's generated tables: the same files in Debug and RelWithDebInfo (docs/port/OPTIMIZED.md).
    needs: windows-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-Debug
          path: debug
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-RelWithDebInfo
          path: rel
      - name: The generated tables
        run: |
          for f in data.c data_symbols.txt; do
            cmp debug/pc-data/$f rel/pc-data/$f && echo "$f: the same in both builds"
          done

  windows-run:
    # The cross-compiled program on Windows: the self-test, the boot without a ROM and the synthetic cartridge's
    # paths (generated here from the cross build's data report). Mesa's opengl32.dll (llvmpipe, from
    # mesa-dist-win) next to it gives the headless WGL context a GL 3 driver on a runner without a GPU.
    needs: windows-cross
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, RelWithDebInfo]
    runs-on: windows-latest
    env:
      MESA_7Z: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-${{ matrix.build }}
          path: bin
      - name: Software OpenGL
        run: |
          curl -sSL -o mesa.7z "$MESA_7Z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          cp mesa/x64/*.dll bin/
      - name: Self-test
        run: bin/rush2049pc.exe --selftest
      - name: Boot without a ROM
        run: |
          RUSH_TRACE_WAVES=1 GALLIUM_DRIVER=llvmpipe bin/rush2049pc.exe --no-rom --headless --no-config \
            --audio null --seconds 10 > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Boot the synthetic cartridge
        # As on Linux (docs/port/SYNTH.md): the generator reads the build's data report, then each press script's
        # path runs, with exact floats and a status line each second as ctest's synth_boot_* run them (--exact): the
        # logs windows-same compares with Linux's.
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -X utf8 src/tools/port/synth_rom.py --data-symbols bin/pc-data/data_symbols.txt \
            --out synth/rush2049_synth.z64
          # the mods paths' mods, as ctest's mods_synth fixture makes them (docs/port/MODS.md 8)
          python -X utf8 src/tools/port/mods_synth.py --rom synth/rush2049_synth.z64 --out synth/paths/mods
          python -X utf8 src/tools/port/synth_paths.py --exe bin/rush2049pc.exe --rom synth/rush2049_synth.z64 \
            --logs synth/paths --exact
      - name: Live input steers
        # The release's toolchain (docs/port/FRONTEND.md "Testing live input"): virtual controllers, a joystick and
        # keys drive the synthetic race as the scripts do, and the car's steering input follows the stick.
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          python -X utf8 src/tools/port/input_check.py --exe bin/rush2049pc.exe --rom synth/rush2049_synth.z64 \
            --logs synth/input
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows-run-${{ matrix.build }}
          path: |
            boot.log
            synth/paths/
            synth/input/
            synth/rush2049_synth.txt
          if-no-files-found: ignore

  windows-same:
    # The Windows program's game is Linux's (docs/port/WINDOWS.md 12): windows-run's logs against the linux jobs' of
    # the same build type, x86-64's and aarch64's. The same synthetic cartridge (its report), and along every
    # synthetic path on the virtual clock and every live-input run the same trace: the states at the same retraces,
    # and each second the first car's position, speed and steering to the bit (synth_paths.py --exact,
    # synth_compare.py --from-logs). Nothing runs here but the comparison of the logs the jobs uploaded; a path that
    # failed in either job differs or is missing.
    needs: [linux, windows-run]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, RelWithDebInfo]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: logs-windows-run-${{ matrix.build }}
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: logs-ubuntu-24.04-${{ matrix.build }}
          path: x86-64
      - uses: actions/download-artifact@v4
        with:
          name: logs-ubuntu-24.04-arm-${{ matrix.build }}
          path: aarch64
      - name: The same cartridge
        run: |
          for l in x86-64 aarch64; do
            diff <(tr -d '\r' < windows/synth/rush2049_synth.txt) $l/build/pc/synth/rush2049_synth.txt > /dev/null
            echo "the synthetic cartridge: Windows's report is $l's"
          done
      - name: The same game
        run: |
          s=0
          for l in x86-64 aarch64; do
            for d in paths input; do
              echo "== Windows against $l: synth/$d"
              python3 tools/port/synth_compare.py --from-logs $l/build/pc/synth/$d windows/synth/$d || s=1
            done
          done
          exit $s

  windows-replay:
    # Lockstep's core across OSes without a network (docs/port/LOCKSTEP.md 8, NETPLAY.md phase 0.3): the input
    # recordings the linux jobs' ctest made (replay_same_<path>: each synthetic path's pads, retrace by retrace, and
    # the replay's log), replayed by the cross-built Windows program. Its trace (every retrace's physics and pads,
    # exact floats) and its state hash at every retrace (the window's, own storage's and the decoupled data's every
    # 30) must be Linux's, x86-64's and aarch64's (tools/port/replay_check.py replay-dir). A recording's header says
    # what it must match (the commit, the cartridge, the settings), so each is replayed on the synthetic cartridge
    # its job made (synth_rom.py's least-squares sine fit can differ in the last bits from one Python to another), with
    # the mods paths' mods made from it.
    needs: [linux, windows-cross]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, RelWithDebInfo]
    runs-on: windows-latest
    env:
      MESA_7Z: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-${{ matrix.build }}
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: logs-ubuntu-24.04-${{ matrix.build }}
          path: x86-64
      - uses: actions/download-artifact@v4
        with:
          name: logs-ubuntu-24.04-arm-${{ matrix.build }}
          path: aarch64
      - name: Software OpenGL
        run: |
          curl -sSL -o mesa.7z "$MESA_7Z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          cp mesa/x64/*.dll bin/
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Replay Linux's recordings
        # Each job's cartridge, and the mods paths' mods as windows-run makes them (the texture pack from mods_dump's
        # run) from it.
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          s=0
          for l in x86-64 aarch64; do
            echo "== Linux $l's recordings on Windows"
            rom=$l/build/pc/synth/rush2049_synth.z64
            python -X utf8 src/tools/port/mods_synth.py --rom $rom --out synth/$l/paths/mods
            python -X utf8 src/tools/port/synth_paths.py --exe bin/rush2049pc.exe --rom $rom \
              --logs synth/$l/paths mods_dump || s=1
            python -X utf8 src/tools/port/replay_check.py replay-dir --exe bin/rush2049pc.exe --rom $rom \
              --logs synth/$l/replay --mods synth/$l/paths/mods --from $l/build/pc/synth/replay || s=1
          done
          exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows-replay-${{ matrix.build }}
          path: |
            synth/*/replay/*.log
          if-no-files-found: ignore

  windows:
    # Windows x86-64 built natively with MSYS2's mingw-w64 (UCRT64), with its SDL2: the build, all tests, the
    # self-test and the boot without a ROM. Mesa's llvmpipe for the GL tests, as in windows-run. A failing test is
    # run again under gdb for a backtrace.
    runs-on: windows-latest
    env:
      MESA_7Z: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
      MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-gdb p7zip curl
      - name: Configure
        run: cmake -S . -B build/pc -G Ninja
      - name: Build
        id: build
        run: |
          set -o pipefail
          cmake --build build/pc -j4 2>&1 | cut -c1-2000
      - name: Software OpenGL
        run: |
          curl -sSL -o mesa.7z "$MESA_7Z"
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c
          7z x -omesa mesa.7z > /dev/null
          for d in build/pc build/pc/port/gfx build/pc/port/input; do cp mesa/x64/*.dll $d/; done
      - name: Tests
        # As on Linux: the tests that measure the host's clock (label realtime) get up to three tries each.
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          t=build/pc/Testing/Temporary/LastTestsFailed.log
          s=0; : > failed.log
          ctest --test-dir build/pc --output-on-failure -LE realtime || { s=1; cat $t >> failed.log || :; }
          rm -f $t
          ctest --test-dir build/pc --output-on-failure -L realtime --repeat until-pass:3 ||
            { s=1; cat $t >> failed.log || :; }
          [ $s = 0 ] && exit 0
          ctest --test-dir build/pc --show-only=json-v1 > tests.json
          python3 - <<'PY'
          import json, subprocess
          failed = {l.split(":", 1)[1].strip() for l in open("failed.log") if ":" in l}
          for t in json.load(open("tests.json"))["tests"]:
              if t["name"] in failed:
                  wd = next((p["value"] for p in t.get("properties", []) if p["name"] == "WORKING_DIRECTORY"), None)
                  print("::group::gdb " + t["name"], flush=True)
                  subprocess.run(["gdb", "-batch", "-ex", "run", "-ex", "bt", "-ex", "info registers", "--args"]
                                 + t["command"], cwd=wd)
                  print("::endgroup::", flush=True)
          PY
          exit 1
      - name: Self-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: build/pc/rush2049pc.exe --selftest
      - name: Boot without a ROM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          RUSH_TRACE_WAVES=1 GALLIUM_DRIVER=llvmpipe build/pc/rush2049pc.exe --no-rom --headless --no-config \
            --audio null --seconds 10 > boot.log 2>&1 || true
          cat boot.log
          grep -q "wave 0 loaded" boot.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-windows
          path: |
            boot.log
            build/pc/pc-data/data_layout.txt
            build/pc/synth/paths/*.log
            build/pc/synth/paced-*/*/run.log
            build/pc/synth/rush2049_synth.txt
          if-no-files-found: ignore

  windows-native-same:
    # As windows-same, for the windows job's program (MSYS2's GCC and the UCRT's C library, a Debug build): its
    # ctest's synthetic paths against the Linux Debug builds' (docs/port/WINDOWS.md 12).
    needs: [linux, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: logs-windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: logs-ubuntu-24.04-Debug
          path: x86-64
      - uses: actions/download-artifact@v4
        with:
          name: logs-ubuntu-24.04-arm-Debug
          path: aarch64
      - name: The same cartridge and the same game
        run: |
          s=0
          for l in x86-64 aarch64; do
            diff <(tr -d '\r' < windows/build/pc/synth/rush2049_synth.txt) $l/build/pc/synth/rush2049_synth.txt \
              > /dev/null && echo "the synthetic cartridge: Windows's report is $l's" || s=1
            echo "== Windows (MSYS2) against $l: synth/paths"
            python3 tools/port/synth_compare.py --from-logs $l/build/pc/synth/paths windows/build/pc/synth/paths || s=1
          done
          exit $s

  n64-neutral:
    # PC edits to shared game C must leave what IDO compiles unchanged (tools/port/n64_neutral.py). The real
    # proof is the matching N64 build, which needs IDO; this compares preprocessed tokens and lines.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base revision 09da2f0
      - name: Shared game C against the decompilation it started from
        run: python3 tools/port/n64_neutral.py --base 09da2f0 -q $(git diff --name-only 09da2f0 -- src include)
